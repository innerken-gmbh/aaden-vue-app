# 合并到 master 后自动构建 web 版，发布到门店 docroot 根目录的 /App（AppCenter 的 rootApps）。
# 门店设备由 aaden-cli appcenter-sync 每天拉取（要 aaden-cli >= 1.6.120 才认 rootApps）。
# 自动灰度：先给 ik0001 + deviceId%100<10，满 24 小时由 innerken-gmbh/workflows 的 appcenter-promote 自动全量；
# 这一天内可以在 innerken-gmbh/workflows 手动跑 appcenter-rollback（app=App，kind=rootApps）回滚。PR 只构建打包，不发布。
#
# 手动按 tag 发布（publish-tag）：master 早已不是版本线（v1.2.x 的 tag 都在 base1.0-rc 上），
# 所以在 master 上 Run workflow，填 tag（只认 v1.2.<数字>）和目标：
#   apps     = 门店 /AppCenter/App（网页收银），manifest 的 apps.App
#   rootApps = 门店 docroot 根的 /App，manifest 的 rootApps.App
# 构建 checkout 的是那个 tag 的代码（Node 22 + npm ci，和 tag 那条线的桌面版 CI 一致）；AWS 角色只信任 master，所以 workflow 必须从 master 跑。
# 同样自动灰度 ik0001 + 10%，满 24 小时 appcenter-promote 全量；回滚在 innerken-gmbh/workflows 跑 appcenter-rollback（app=App，kind=对应目标）。
# 填了 rollout-devices（例如 9020）就只放这些设备、不自动全量，之后在 innerken-gmbh/workflows 跑 appcenter-widen 扩大并开始计 24 小时。
# 第一次发布 apps.App 时清单里没有上一版，appcenter-rollback 用不了：要退回就用这里再发一个旧 tag。
name: appcenter-publish

on:
  push:
    branches: [master]
    # 只改 CI 的提交不重发：version.json 里有 commit，内容没变也会算成新包，重新开灰度、顶掉回滚位
    paths-ignore: ['.github/**']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: '要发布的 tag，例如 v1.2.162（留空 = 按 master 的老方式发 rootApps）'
        required: false
        default: ''
      target:
        description: 'apps = /AppCenter/App（网页收银）；rootApps = 根目录 /App'
        type: choice
        options: [apps, rootApps]
        default: apps
      rollout-devices:
        description: '只放这些设备（逗号分隔，例如 9020）：不自动全量，之后在 innerken-gmbh/workflows 跑 appcenter-widen 扩大。留空 = 默认 ik0001 + 10%，24 小时后全量'
        required: false
        default: ''

concurrency:
  group: appcenter-publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # 按 tag 发布走下面的 publish-tag
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ref == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # master 依赖 node-sass，Node 22 装不上，要 Node 16
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      # 按 yarn.lock 装；跳过根目录 postinstall（electron-builder install-app-deps，web 构建用不到），
      # electron 和 node-sass 自己的安装脚本单独跑（vue-cli 的 electron 插件在 web 构建时也会检查 electron）
      - run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 600000 && npm rebuild electron node-sass
      - run: npx vue-cli-service build
      - uses: innerken-gmbh/workflows/appcenter-publish@main
        with:
          app: App
          kind: rootApps
          dist: dist
          dry-run: ${{ github.event_name == 'pull_request' }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}

  publish-tag:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: 校验输入
        env:
          REF: ${{ inputs.ref }}
          TARGET: ${{ inputs.target }}
        run: |
          [[ "$REF" =~ ^v1\.2\.[0-9]+$ ]] || { echo "::error::ref 只接受 v1.2.<数字> 这样的 tag，收到「$REF」"; exit 1; }
          [[ "$TARGET" == apps || "$TARGET" == rootApps ]] || { echo "::error::target 只能是 apps 或 rootApps"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/master ] || { echo "::error::要从 master 运行（AWS 角色只信任 master）"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.ref }}
      - name: 核对 tag 和 package.json 版本一致
        env:
          REF: ${{ inputs.ref }}
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "$REF" ] || { echo "::error::tag $REF 里的 package.json 版本是 $V"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 跳过 postinstall（electron-builder install-app-deps）；electron 自己的安装脚本单独跑：web 构建时 vue-cli 的 electron 插件也会检查它
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm rebuild electron
      - run: npx vue-cli-service build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - uses: innerken-gmbh/workflows/appcenter-publish@main
        with:
          app: App
          kind: ${{ inputs.target }}
          rollout-devices: ${{ inputs.rollout-devices }}
          dist: dist
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
