# This workflow will do a clean installation of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Release App To Github

on:
  push:
    tags:
      - v**

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:

      - name: Commit File
        uses: actions/checkout@v4
      - uses: olegtarasov/get-tag@v2.1.3
        id: tagName
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Create Draft Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tagName.outputs.tag }}
          release_name: ${{ steps.tagName.outputs.tag }}
          draft: true
          prerelease: false
      - run: npm install
      - run: npm run win:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 更新源（POS-36）：安装包同时传到 S3 desktop/win（公开可读），客户端先读这里。
      # latest.yml 最后传，免得客户端读到新版本时安装包还没到。传失败的话 GitHub Release 留在草稿，不会发出去。
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::866730148977:role/github-appcenter-publish
          aws-region: eu-central-1
      - name: Upload to S3 desktop/win
        shell: bash
        run: |
          set -euo pipefail
          cd dist_electron
          ls -la *.exe *.blockmap latest.yml
          for f in *.exe *.blockmap; do
            aws s3 cp "$f" "s3://aaden-backend/desktop/win/$f" --acl public-read
          done
          aws s3 cp latest.yml s3://aaden-backend/desktop/win/latest.yml --acl public-read --cache-control no-cache
      - uses: eregon/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create_release.outputs.id }}
